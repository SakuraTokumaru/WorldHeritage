<!DOCTYPE html>
<html lang="ja">
<head>
    <title>ログイン | IDM世界遺産部</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="auth.js?v=2" defer></script>
</head>
<body>
    <header class="auth-header">
        <a class="logo" href="main.html"><span class="logo-mark">🌍</span>IDM世界遺産部</a>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <span class="frame frame-tl"></span><span class="frame frame-br"></span>
            <p class="eyebrow">Login</p>
            <h1>ログイン</h1>
            <p class="lead">部員の方はメールアドレスとパスワードでログインしてください。</p>

            <div id="message" class="message" role="alert" hidden></div>

            <form id="login-form" novalidate>
                <label for="email">メールアドレス</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="example@mail.com" required>

                <label for="password">パスワード</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">ログイン</button>
            </form>

            <p class="switch">アカウントをお持ちでない方は <a href="signup.html">新規登録はこちら</a></p>
        </section>
    </main>
</body>
</html>
